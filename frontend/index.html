<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="application-name" content="CivicsPulse" />
  <meta name="description" content="CivicsPulse helps Mumbai citizens raise civic issues, track public timelines, and map ward reports to corporators and MLAs." />
  <meta name="robots" content="index, follow" />
  <meta name="keywords" content="CivicsPulse, Mumbai civic reporting, ward issue tracker, report pothole Mumbai, corporator list Mumbai, MLA list Mumbai" />
  <link rel="canonical" href="https://civicspulse.in/" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta property="og:site_name" content="CivicsPulse" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CivicsPulse - Mumbai civic reporting and issue tracker" />
  <meta property="og:description" content="Raise civic issues, track public timelines, and map Mumbai ward reports to corporators and MLAs through CivicsPulse." />
  <meta property="og:url" content="https://civicspulse.in/" />
  <meta property="og:image" content="https://civicspulse.in/civic-hero.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="CivicsPulse - Mumbai civic reporting and issue tracker" />
  <meta name="twitter:description" content="Raise civic issues, track public timelines, and map Mumbai ward reports to corporators and MLAs through CivicsPulse." />
  <meta name="twitter:image" content="https://civicspulse.in/civic-hero.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://civicspulse.in/#organization",
          "name": "CivicsPulse",
          "url": "https://civicspulse.in/",
          "logo": "https://civicspulse.in/icon.png",
          "areaServed": "Mumbai, Maharashtra, India"
        },
        {
          "@type": "WebSite",
          "@id": "https://civicspulse.in/#website",
          "name": "CivicsPulse",
          "url": "https://civicspulse.in/",
          "publisher": { "@id": "https://civicspulse.in/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://civicspulse.in/public-issues?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
  </script>
  <title>CivicsPulse</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
